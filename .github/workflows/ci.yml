name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haunted_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haunted_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HAUNTED_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/haunted_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and apply migrations
        run: |
          psql "$HAUNTED_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
          for f in supabase/migrations/*.sql; do
            psql "$HAUNTED_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run database tests
        run: pnpm exec vitest run tests/db
